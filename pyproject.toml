[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netfault"
version = "0.1.0"
description = "Measure a linear circuit and find out which component is wrong."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Max Nussbaumer", email = "max.nussbaumer@maxhealth.tech" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]
keywords = ["spice", "netlist", "fault", "diagnosis", "circuit", "measurement"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Manufacturing",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[dependency-groups]
# uv sync picks these up; the library itself needs none of them.
dev = ["sounddevice>=0.4"]

[project.optional-dependencies]
# Only the bench example needs a sound device; the library and the tests
# do not, which is the point of the play_record seam.
bench = ["sounddevice>=0.4"]

[project.urls]
Homepage = "https://github.com/quotentiroler/netfault"
Issues = "https://github.com/quotentiroler/netfault/issues"

[tool.setuptools]
packages = ["netfault"]
